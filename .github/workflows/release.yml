name: Release synchronized npm packages

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: npm
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          lfs: true
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci:verify
      - run: pnpm run library:build
      - run: pnpm run library:verify
      - name: Require synchronized code-package version
        run: node scripts/release-library.mjs verify-code-version "${RELEASE_TAG#v}"
      - name: Pack verified code packages
        run: node scripts/pack-library.mjs --group code --destination release-tarballs
      - name: Publish contracts
        run: npm publish ./release-tarballs/wasm-oj-contracts-${RELEASE_TAG#v}.tgz --access public
      - name: Publish core
        run: npm publish ./release-tarballs/wasm-oj-core-${RELEASE_TAG#v}.tgz --access public
      - name: Publish hosts and Organizer
        run: |
          npm publish ./release-tarballs/wasm-oj-browser-${RELEASE_TAG#v}.tgz --access public
          npm publish ./release-tarballs/wasm-oj-server-${RELEASE_TAG#v}.tgz --access public
          npm publish ./release-tarballs/wasm-oj-organizer-${RELEASE_TAG#v}.tgz --access public
      - name: Publish CLI
        run: npm publish ./release-tarballs/wasm-oj-cli-${RELEASE_TAG#v}.tgz --access public
      - name: Publish umbrella SDK
        run: npm publish ./release-tarballs/wasm-oj-sdk-${RELEASE_TAG#v}.tgz --access public
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${RELEASE_TAG}" --verify-tag --generate-notes --latest
